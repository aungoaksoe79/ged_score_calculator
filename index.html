<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 

<div class="container">
    <h1>GED Score Calculator</h1>
<p class="subtitle">
    Calculate total score, average score, and percentage.
</p>

  <input type="text" id="name" placeholder="Enter Your Name...."><br><br>
  <input type="number" id="maths" placeholder="Enter Your Maths Score...."><br><br>
  <input type="number" id="english" placeholder="Enter Your RLA Score...."><br><br>
  <input type="number" id="science" placeholder="Enter Your Science Score...."><br><br>
  <input type="number" id="social_studies" placeholder="Enter Your Social Studies Score...."><br><br>
  <button id="submit">Submit</button>

  <p id="ans1">Name: <span id="name1"></span></p>
  <p id="ans2">Total Score: <span id="total1"></span></p>
  <p id="ans3">Average Score: <span id="average1"></span></p>
  <p id="ans4">Percentage of 800: <span id="percentage1"></span></p>
  <div class="publisher">
    Created by Xattora
</div>
</div>
  
  
  <script src="index.js"></script>
</body>
</html>
